<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RB Mobile Mechanic | Enfield</title>

:root {
  --bg: #080a0d;
  --card: #111419;
  --card2: #171b21;
  --text: #f5f7fa;
  --muted: #aeb5c0;
  --line: #282e36;
  --red: #ff4b3e;
  --red2: #ff684f;
  --green: #32d583;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1120px, 92%);
  margin: auto;
}

/* TOP BAR */

.topbar {
  background: #0d1014;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
}

.topbar .container {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
}

/* NAV */

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(8,10,13,.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.nav {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 21px;
  font-weight: 900;
  letter-spacing: -.8px;
}

.logo span {
  color: var(--red);
}

.navlinks {
  display: flex;
  gap: 28px;
  color: #c7ccd4;
  font-size: 14px;
}

.navlinks a:hover {
  color: white;
}

.navbtn {
  background: var(--red);
  padding: 10px 16px;
  border-radius: 9px;
  font-weight: 800;
  font-size: 14px;
}

/* HERO */

.hero {
  min-height: 680px;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  align-items: center;
  gap: 60px;
  padding: 80px 0;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 7px 12px;
  border-radius: 999px;
  color: #dce0e5;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 22px;
}

.status-dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(50,213,131,.12);
}
